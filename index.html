<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Правовые документы</title>
<style>
  :root { --bg:#fbf9f6; --fg:#21201c; --muted:#6b6763; --rule:#e4dfd7; --accent:#b4622a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1917; --fg:#ece8e1; --muted:#a09a92; --rule:#35322e; --accent:#e2955c; }
  }
  body { margin:0; padding:3rem 1.25rem; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:34rem; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 .4rem; letter-spacing:-.01em; }
  p { color:var(--muted); margin:0 0 2rem; }
  ul { list-style:none; padding:0; margin:0; }
  li { padding:.9rem 0; border-top:1px solid var(--rule); }
  a { color:var(--accent); text-decoration:none; font-weight:600; }
  a:hover { text-decoration:underline; }
  .pkg { display:block; color:var(--muted); font-size:.85rem; font-weight:400; margin-top:.15rem; }
</style>
</head>
<body>
<main>
  <h1>Правовые документы</h1>
  <p>Политики конфиденциальности приложений.</p>
  <ul>
    <li>
      <a href="literio/privacy/">Литерио — политика конфиденциальности</a>
      <span class="pkg">com.dolgitem.literio</span>
    </li>
    <li>
      <a href="confuel/privacy/">Confuel — политика конфиденциальности</a>
      <span class="pkg">com.dolgitem.confuel</span>
    </li>
    <li>
      <a href="qro/privacy/">Qro — политика конфиденциальности</a>
      <span class="pkg">com.dolgitem.qrcodeapp</span>
    </li>
  </ul>
</main>
</body>
</html>
